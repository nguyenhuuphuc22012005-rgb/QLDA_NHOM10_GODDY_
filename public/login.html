<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Đăng nhập | GODDY RECRUIT</title>

    <!-- Google Font: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Project CSS -->
    <link rel="stylesheet" href="css/style.css">

    <style>
        body {
            min-height: 100vh;
            margin: 0;
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 55%, #4338ca 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .login-page {
            width: 100%;
            max-width: 430px;
        }

        .login-card {
            background: #fff;
            border-radius: 20px;
            padding: 36px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
        }

        .login-logo {
            width: 64px;
            height: 64px;
            margin: 0 auto 16px;
            border-radius: 16px;
            background: linear-gradient(135deg, #6366f1, #4f46e5);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            box-shadow: 0 8px 20px rgba(79, 70, 229, .35);
        }

        .login-title {
            text-align: center;
            margin-bottom: 6px;
            color: #1e293b;
            font-size: 24px;
            font-weight: 800;
        }

        .login-subtitle {
            text-align: center;
            margin-bottom: 28px;
            color: #64748b;
            font-size: 13px;
        }

        .form-label {
            color: #334155;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .input-group-text {
            background: #fff;
            border-right: 0;
            color: #94a3b8;
        }

        .form-control {
            height: 46px;
            border-left: 0;
            font-size: 14px;
        }

        .form-control:focus {
            border-color: #4f46e5;
            box-shadow: 0 0 0 .2rem rgba(79, 70, 229, .12);
        }

        .input-group:focus-within .input-group-text {
            border-color: #4f46e5;
            color: #4f46e5;
        }

        .password-toggle {
            border-left: 0;
            background: #fff;
            color: #94a3b8;
        }

        .password-toggle:hover {
            color: #4f46e5;
        }

        .login-btn {
            height: 48px;
            border: 0;
            border-radius: 10px;
            background: #4f46e5;
            color: #fff;
            font-size: 14px;
            font-weight: 700;
            transition: .2s;
        }

        .login-btn:hover {
            background: #4338ca;
            transform: translateY(-1px);
        }

        .login-btn:disabled {
            opacity: .7;
            transform: none;
        }

        .login-message {
            display: none;
            border-radius: 9px;
            padding: 11px 14px;
            margin-bottom: 18px;
            font-size: 13px;
        }

        .login-message.error {
            display: block;
            background: #fee2e2;
            color: #b91c1c;
        }

        .login-message.success {
            display: block;
            background: #dcfce7;
            color: #15803d;
        }

        .login-footer {
            margin-top: 24px;
            text-align: center;
            color: #94a3b8;
            font-size: 11px;
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 28px 22px;
            }
        }
    </style>
</head>

<body>

<div class="login-page">

    <div class="login-card">

        <div class="login-logo">
            <i class="fa-solid fa-chart-pie"></i>
        </div>

        <h1 class="login-title">GODDY RECRUIT</h1>

        <p class="login-subtitle">
            Đăng nhập hệ thống quản lý Công Nợ B2B
        </p>

        <div id="loginMessage" class="login-message"></div>

        <form id="loginForm">

            <!-- USERNAME -->
            <div class="mb-3">
                <label for="username" class="form-label">
                    Tài khoản
                </label>

                <div class="input-group">
                    <span class="input-group-text">
                        <i class="fa-solid fa-user"></i>
                    </span>

                    <input
                        type="text"
                        id="username"
                        class="form-control"
                        placeholder="Nhập tài khoản"
                        autocomplete="username"
                        required
                    >
                </div>
            </div>

            <!-- PASSWORD -->
            <div class="mb-3">
                <label for="password" class="form-label">
                    Mật khẩu
                </label>

                <div class="input-group">
                    <span class="input-group-text">
                        <i class="fa-solid fa-lock"></i>
                    </span>

                    <input
                        type="password"
                        id="password"
                        class="form-control"
                        placeholder="Nhập mật khẩu"
                        autocomplete="current-password"
                        required
                    >

                    <button
                        type="button"
                        class="btn password-toggle"
                        id="togglePassword"
                    >
                        <i class="fa-solid fa-eye"></i>
                    </button>
                </div>
            </div>

            <!-- REMEMBER -->
            <div class="d-flex justify-content-between align-items-center mb-4">

                <div class="form-check">
                    <input
                        class="form-check-input"
                        type="checkbox"
                        id="remember"
                    >

                    <label
                        class="form-check-label text-muted small"
                        for="remember"
                    >
                        Ghi nhớ đăng nhập
                    </label>
                </div>

                <span class="text-primary small fw-semibold">
                    GODDY
                </span>

            </div>

            <!-- LOGIN -->
            <button
                type="submit"
                class="btn login-btn w-100"
                id="loginButton"
            >
                <i class="fa-solid fa-right-to-bracket me-2"></i>
                Đăng nhập
            </button>

        </form>

        <div class="login-footer">
            Đồ án QLDA - Nhóm 10<br>
            GODDY RECRUIT © 2026
        </div>

    </div>

</div>

<script>
    const loginForm = document.getElementById('loginForm');
    const usernameInput = document.getElementById('username');
    const passwordInput = document.getElementById('password');
    const loginButton = document.getElementById('loginButton');
    const loginMessage = document.getElementById('loginMessage');
    const togglePassword = document.getElementById('togglePassword');

    // Hiển thị / ẩn mật khẩu
    togglePassword.addEventListener('click', function () {
        const icon = this.querySelector('i');

        if (passwordInput.type === 'password') {
            passwordInput.type = 'text';

            icon.classList.remove('fa-eye');
            icon.classList.add('fa-eye-slash');
        } else {
            passwordInput.type = 'password';

            icon.classList.remove('fa-eye-slash');
            icon.classList.add('fa-eye');
        }
    });

    function showMessage(message, type) {
        loginMessage.textContent = message;
        loginMessage.className = 'login-message ' + type;
    }

    loginForm.addEventListener('submit', async function (event) {
        event.preventDefault();

        const username = usernameInput.value.trim();
        const password = passwordInput.value;

        if (!username || !password) {
            showMessage(
                'Vui lòng nhập đầy đủ tài khoản và mật khẩu.',
                'error'
            );
            return;
        }

        loginButton.disabled = true;

        loginButton.innerHTML =
            '<i class="fa-solid fa-spinner fa-spin me-2"></i>Đang đăng nhập...';

        try {

            const response = await fetch('/api/auth/login', {
                method: 'POST',

                headers: {
                    'Content-Type': 'application/json'
                },

                body: JSON.stringify({
                    username: username,
                    password: password
                })
            });

            const data = await response.json();

            if (data.success && data.token) {

                // Lưu JWT đúng key đang được project sử dụng
                localStorage.setItem('goddy_token', data.token);

                // Lưu thông tin user nếu API trả về
                if (data.user) {
                    localStorage.setItem(
                        'goddy_user',
                        JSON.stringify(data.user)
                    );
                }

                showMessage(
                    'Đăng nhập thành công!',
                    'success'
                );

                // Chuyển về Dashboard
                setTimeout(function () {
                    window.location.href = 'index.html';
                }, 800);

            } else {

                showMessage(
                    data.message || 'Đăng nhập thất bại!',
                    'error'
                );

            }

        } catch (error) {

            showMessage(
                'Không thể kết nối đến máy chủ. Vui lòng kiểm tra Backend.',
                'error'
            );

        } finally {

            loginButton.disabled = false;

            loginButton.innerHTML =
                '<i class="fa-solid fa-right-to-bracket me-2"></i>Đăng nhập';
        }
    });
</script>

</body>
</html>
